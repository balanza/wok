name: Release
permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v3

      - name: Format release notes
        id: format_release_notes
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          git log -1 --pretty=%B | tail -n +2 | sed '/^\s*$/d' >> release_notes.txt
          echo "\n\n**Full Changelog**: https://github.com/balanza/wok/commits/${TAG_NAME}" >> release_notes.txt
          echo "formatted_body<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.format_release_notes.outputs.tag_name }}
          body: ${{ steps.format_release_notes.outputs.formatted_body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        target: ["x86_64-unknown-linux-gnu"]

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/wok
          asset_name: wok-${{ matrix.target }}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
